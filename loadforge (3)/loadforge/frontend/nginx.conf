server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

  # Live test progress (Server-Sent Events): no buffering, long timeouts
  location ~ ^/api/runs/[^/]+/stream$ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding on;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Built-in demo target API (handy for trying the app)
  location /demo/ {
    proxy_pass http://backend:8080;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
